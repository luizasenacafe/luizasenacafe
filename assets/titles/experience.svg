<svg xmlns="http://www.w3.org/2000/svg" width="880" height="60" viewBox="0 0 880 60" role="img" aria-label="Experiência">
<title>Experiência</title><style>
  .letter { fill: #f39bb9; animation: rose 7s ease-in-out infinite; }
  @keyframes rose { 0%,30%,100% { fill: #f39bb9; } 12%,18% { fill: #ffe2ed; } }
  @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
</style>
<defs><linearGradient id="bg"><stop stop-color="#241727"/><stop offset="1" stop-color="#161522"/></linearGradient></defs>
<rect width="880" height="60" rx="10" fill="url(#bg)"/>
<rect x="0" y="12" width="3" height="36" rx="1.5" fill="#ee7eab"/>
<g font-family="Trebuchet MS,Segoe UI,Arial,sans-serif" font-weight="600" letter-spacing=".5"><text x="22" y="38" font-size="22" xml:space="preserve"><tspan class="letter" style="animation-delay:0.000s">E</tspan><tspan class="letter" style="animation-delay:0.055s">x</tspan><tspan class="letter" style="animation-delay:0.110s">p</tspan><tspan class="letter" style="animation-delay:0.165s">e</tspan><tspan class="letter" style="animation-delay:0.220s">r</tspan><tspan class="letter" style="animation-delay:0.275s">i</tspan><tspan class="letter" style="animation-delay:0.330s">ê</tspan><tspan class="letter" style="animation-delay:0.385s">n</tspan><tspan class="letter" style="animation-delay:0.440s">c</tspan><tspan class="letter" style="animation-delay:0.495s">i</tspan><tspan class="letter" style="animation-delay:0.550s">a</tspan></text></g>
</svg>